<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Study Notes</title>
  <script src="/sail/baremux/index.js"></script>
  <script src="/scramjet.all.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; }
    #top { display: flex; padding: 8px; gap: 6px; background: #1e1e1e; }
    #bar { flex: 1; padding: 6px 10px; border-radius: 4px; border: none; }
    button { padding: 6px 14px; border-radius: 4px; border: none; cursor: pointer; }
    #frame { width: 100%; height: calc(100vh - 46px); border: none; position: absolute; bottom: 0; }
  </style>
</head>
<body>
  <div id="top">
    <input type="text" placeholder="Enter URL or search..." id="bar" />
    <button onclick="nav()">Go</button>
  </div>
  <iframe id="frame"></iframe>

  <script>
    const connection = new BareMux.BareMuxConnection("/sail/baremux/worker.js");
    const wispurl = "wss://aluu.xyz/wisp/";

    const frame = document.getElementById("frame");
    const bar = document.getElementById("bar");

    const { ScramjetController } = $scramjetLoadController();
    const scramjet = new ScramjetController({
      files: {
        wasm: "/scramjet.wasm.wasm",
        all: "/scramjet.all.js",
        sync: "/scramjet.sync.js",
      },
      prefix: "/sail/go/",
    });

    scramjet.init();

    async function nav() {
      let url = bar.value.trim();
      if (!url) return;

      if (!url.includes(".")) {
        url = "https://google.com" + encodeURIComponent(url);
      } else if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }

      await connection.setTransport("/sail/libcurl/index.mjs", [{ wisp: wispurl }]);
      frame.src = scramjet.encodeUrl(url);
    }

    bar.addEventListener("keydown", (e) => {
      if (e.key === "Enter") nav();
    });
  </script>
</body>
</html>
